name: Linux lint baseline comparison

on:
  pull_request:
  push:
    branches: ["fix/truck-capacity-import-scoring-2026-10-12"]

permissions:
  contents: read

jobs:
  compare:
    name: Compare exact head with untouched reviewed base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Compare unchanged rules and frozen dependencies
        env:
          LINT_BASE_SHA: "83fd68e03befad3c234dc5c0fbee71f0184bded7"
          LINT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/lint-comparison.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-lint-comparison
          path: ${{ runner.temp }}/lint-comparison/*.json
